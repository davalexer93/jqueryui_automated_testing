name: Serenity Tests
on:
  push:
    branches:
      - main
      - master
      - feature/*
  schedule:
    - cron: "00 15 * * FRI"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK Temurin 18.0.2
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '18.0.2'

      - name: Run Serenity tests
        run: gradle clean test --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: serenity report
          path: target/site/serenity
          retention-days: 3
